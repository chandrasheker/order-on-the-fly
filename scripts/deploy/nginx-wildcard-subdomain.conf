# Wildcard restaurant subdomains → one Next.js app.
#
# DNS:
#   dvadtech.in            A/AAAA → this host   (@)
#   www.dvadtech.in        CNAME/A → apex
#   oof.dvadtech.in        A/AAAA → this host
#   *.oof.dvadtech.in      A/AAAA → this host   (canonical restaurant/tenant hosts)
#   *.dvadtech.in          A/AAAA → this host   (legacy restaurant hosts; keep during QR/bookmark migration)
#
# TLS certificate SANs MUST include:
#   dvadtech.in
#   www.dvadtech.in
#   oof.dvadtech.in
#   *.oof.dvadtech.in
#   *.dvadtech.in            (legacy transition; a single-label wildcard does not cover *.oof.dvadtech.in)
#
# The proxy MUST preserve the original Host. Do not rewrite Host to localhost.
# Do not expose the Next.js/Node port publicly.
# Only set TRUST_FORWARDED_HOST=1 if you also overwrite X-Forwarded-Host
# (do not append) and the Node port is not public. Default is Host-only.
#
# Cookies stay host-only. Do not set cookie Domain=.dvadtech.in.

map $host $tabletap_forwarded_host {
    default $host;
}

# Unknown hosts (raw IPs, random domains) never reach the app.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;
    # ssl_certificate     /etc/letsencrypt/live/dvadtech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dvadtech.in/privkey.pem;
    return 444;
}

# www → apex (permanent). Application also 308s; this avoids an extra hop.
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.dvadtech.in;
    # ssl_certificate     /etc/letsencrypt/live/dvadtech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dvadtech.in/privkey.pem;
    return 301 https://dvadtech.in$request_uri;
}

server {
    listen 443 ssl http2;
    # Canonical company + OOF product + restaurant hosts, plus legacy *.dvadtech.in.
    # Nginx wildcards are single-label: *.oof.dvadtech.in matches abc.oof.dvadtech.in
    # but not foo.bar.oof.dvadtech.in.
    server_name dvadtech.in oof.dvadtech.in *.oof.dvadtech.in *.dvadtech.in;

    # ssl_certificate     /etc/letsencrypt/live/dvadtech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dvadtech.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $tabletap_forwarded_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Caddy equivalent:
#
# www.dvadtech.in {
#     redir https://dvadtech.in{uri} permanent
# }
#
# dvadtech.in, oof.dvadtech.in, *.oof.dvadtech.in, *.dvadtech.in {
#     reverse_proxy 127.0.0.1:3000
# }
#
# Catch-all unknown hosts (do not forward to the app):
#
# :80, :443 {
#     abort
# }
