# Wildcard restaurant subdomains → one Next.js app.
# DNS: *.dvadtech.in A/AAAA → this host
# TLS: wildcard cert (*.dvadtech.in) or a SAN covering each restaurant.
#
# The proxy MUST preserve the original Host. Do not rewrite Host to localhost.
# Only set TRUST_FORWARDED_HOST=1 if you also overwrite X-Forwarded-Host
# (do not append) and the Node port is not public.

map $host $tabletap_forwarded_host {
    default $host;
}

server {
    listen 443 ssl http2;
    server_name dvadtech.in www.dvadtech.in platform.dvadtech.in *.dvadtech.in;

    # ssl_certificate     /etc/letsencrypt/live/dvadtech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dvadtech.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $tabletap_forwarded_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Caddy equivalent:
#
# dvadtech.in, www.dvadtech.in, platform.dvadtech.in, *.dvadtech.in {
#     reverse_proxy 127.0.0.1:3000
# }
